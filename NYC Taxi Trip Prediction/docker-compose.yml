services:
  app:
    build: .
    image: nyc-taxi-trip-prediction:latest
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # Mount artifacts rather than baking them in, so retraining on the host
      # is picked up by a container restart instead of a rebuild.
      - ./models:/app/models:ro
      - ./data/geo:/app/data/geo:ro
    environment:
      - PYTHONPATH=/app/src
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
